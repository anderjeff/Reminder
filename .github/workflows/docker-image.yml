name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build image
      run: |
        docker build . \
          --file Dockerfile \
          --tag andersonjjames/reminder:latest \
          --tag andersonjjames/reminder:${{ github.sha }}

    - name: Push image
      run: |
        docker push andersonjjames/reminder:latest
        docker push andersonjjames/reminder:${{ github.sha }}
